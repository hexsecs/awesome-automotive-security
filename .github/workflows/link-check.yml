name: Link check

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See validate.yml: hosts under [[excluded]] in data/hosts.toml bot-challenge
      # automated clients, so their DOI-backed URLs cannot be verified by any
      # checker and are excluded here too. The runner's system python3 (3.12 on
      # ubuntu-24.04) has tomllib, so no setup-python step is needed.
      - name: Build link-check exclusions from data/hosts.toml
        id: hosts
        shell: bash
        run: |
          flags=$(python3 scripts/validate_list.py --lychee-excludes | sed "s/.*/--exclude '&'/" | paste -sd ' ' -)
          echo "excludes=$flags" >> "$GITHUB_OUTPUT"
          echo "lychee exclusions: $flags"

      - name: Check all links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path LICENSE
            ${{ steps.hosts.outputs.excludes }}
            README.md CONTRIBUTING.md
          output: ./lychee/out.md
          fail: false

      - name: Open or update an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found in the list
          content-filepath: ./lychee/out.md
          labels: |
            maintenance
            broken-link
