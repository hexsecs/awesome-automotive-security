name: Link check

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See validate.yml: ACM, IEEE and EPFL Infoscience bot-challenge automated clients, so their
      # DOI-backed URLs cannot be verified by any checker and are excluded here too.
      - name: Check all links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path LICENSE
            --exclude dl\.acm\.org
            --exclude ieeexplore\.ieee\.org
            --exclude infoscience\.epfl\.ch
            README.md CONTRIBUTING.md
          output: ./lychee/out.md
          fail: false

      - name: Open or update an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found in the list
          content-filepath: ./lychee/out.md
          labels: |
            maintenance
            broken-link
