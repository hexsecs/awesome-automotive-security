name: Validate list

on:
  push:
    branches: [main]
    paths: ['README.md', 'data/**', 'scripts/validate_list.py', '.github/workflows/validate.yml']
  pull_request:
    paths: ['README.md', 'data/**', 'scripts/validate_list.py', '.github/workflows/validate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check list structure
        run: python3 scripts/validate_list.py

      # Hosts under [[excluded]] in data/hosts.toml answer automated clients with a
      # bot challenge rather than the page, so no link checker can verify them;
      # their DOI-backed URLs are stable. Everything else is checked. The flags go
      # on one line because lychee-action evals its args, and single quotes keep
      # each regex's escapes intact through that eval.
      - name: Build link-check exclusions from data/hosts.toml
        id: hosts
        shell: bash
        run: |
          flags=$(python3 scripts/validate_list.py --lychee-excludes | sed "s/.*/--exclude '&'/" | paste -sd ' ' -)
          echo "excludes=$flags" >> "$GITHUB_OUTPUT"
          echo "lychee exclusions: $flags"

      - name: Check links changed in this PR
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path LICENSE
            ${{ steps.hosts.outputs.excludes }}
            README.md
          fail: true
