name: Validate list

on:
  push:
    branches: [main]
    paths: ['README.md', 'scripts/validate_list.py', '.github/workflows/validate.yml']
  pull_request:
    paths: ['README.md', 'scripts/validate_list.py', '.github/workflows/validate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check list structure
        run: python3 scripts/validate_list.py

      # ACM, IEEE, EPFL Infoscience and IACR eprint answer automated clients with 403/202 bot
      # challenges rather
      # than serving the page, so no link checker can verify them. Their DOI-backed
      # URLs are stable; everything else, including every other paper host, is checked.
      - name: Check links changed in this PR
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path LICENSE
            --exclude dl\.acm\.org
            --exclude ieeexplore\.ieee\.org
            --exclude infoscience\.epfl\.ch
            --exclude eprint\.iacr\.org
            README.md
          fail: true
