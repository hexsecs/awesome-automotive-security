name: Discover new entries

on:
  schedule:
    # 07:00 UTC on the first of each month.
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional area to concentrate on (e.g. "EV charging", "V2X")'
        required: false
        type: string

# id-token lets claude-code-action exchange an OIDC token for a Claude GitHub App
# token. PRs opened with that token trigger validate.yml; ones opened with the
# default GITHUB_TOKEN would not, so the bot's proposals would go unchecked.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    # Forks inherit the schedule but not the secret; don't run there.
    if: github.repository == 'hexsecs/awesome-automotive-security'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Discovery normally runs as a scheduled Claude Code Routine that follows
      # the same runbook. This workflow is the optional in-CI path: it runs only
      # when a Claude credential is configured and skips cleanly otherwise.
      - name: Check for a Claude credential
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set; skipping discovery run."
          fi

      - name: Prepare the run
        id: run
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p .scratch .git/info
          echo '.scratch/' >> .git/info/exclude
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Research and propose additions
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Either credential satisfies the action; the unset one is empty.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read and follow prompts/discover.md.
            ${{ inputs.focus && format('Focus area for this run: {0}.', inputs.focus) || '' }}

            Run context (GitHub Actions):
            - Scratch directory, never committed: .scratch/. Write the pull request
              body to .scratch/pr-body.md.
            - Bash accepts only these commands, character for character (git add and
              git commit -m take any arguments):
                python3 scripts/validate_list.py
                python3 scripts/list_health.py
                python3 scripts/list_health.py --no-github
                git status
                git diff
                git checkout -b discover/${{ steps.run.outputs.month }}
                git add <files>
                git commit -m "<message>"
                git push -u origin discover/${{ steps.run.outputs.month }}
                gh pr create --draft --base main --head discover/${{ steps.run.outputs.month }} --title 'Discovery: proposed additions for ${{ steps.run.outputs.month }}' --body-file .scratch/pr-body.md
          # v1 takes tool permissions and turn limits as CLI flags; the old
          # allowed_tools input is silently ignored. As in link-check.yml's
          # fix-links job: Bash is limited to exact commands, so the branch, push
          # target and PR cannot be redirected; Read is scoped to the checkout
          # minus .git/, whose config holds the App token; Edit covers only the
          # files a discovery run may change.
          claude_args: |
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read(./**),Edit(./README.md),Edit(./data/decisions.toml),Edit(./data/hosts.toml),Edit(./.scratch/**),Bash(python3 scripts/validate_list.py),Bash(python3 scripts/list_health.py),Bash(python3 scripts/list_health.py --no-github),Bash(git status),Bash(git diff),Bash(git checkout -b discover/${{ steps.run.outputs.month }}),Bash(git add:*),Bash(git commit -m:*),Bash(git push -u origin discover/${{ steps.run.outputs.month }}),Bash(gh pr create --draft --base main --head discover/${{ steps.run.outputs.month }} --title 'Discovery: proposed additions for ${{ steps.run.outputs.month }}' --body-file .scratch/pr-body.md)"
            --disallowedTools "Read(./.git/**)"
