# Curation decisions: candidates a reviewer rejected, and entries removed from
# the list, with the reason. Automated discovery reads this file so that it
# never re-proposes something already turned down.
#
# scripts/validate_list.py fails if a README entry's URL matches a record here,
# compared as the duplicate check compares them (case, trailing slash and
# https:// ignored). Overturning a decision is deliberate: delete its record in
# the same change that adds the entry back, and say why in that change.
# ("kept" records are the exception: they mark entries that stay.)
#
# Fields
#   name      The entry's name as it was, or would have been, listed.
#   url       The URL that was proposed or listed.
#   decision  "rejected" for a candidate that never landed on the list,
#             "removed" for an entry taken off it, or "kept" for a listed entry
#             that scripts/list_health.py flags as archived or dormant and a
#             maintainer judged still canonical or historically important.
#             Rejected and removed URLs may not appear in the README; a kept
#             URL must, and the health report then lists it as acknowledged
#             rather than as a finding.
#   reason    One or two sentences a later reviewer can judge the candidate by.
#   date      YYYY-MM-DD, when the decision was made.
#   ref       Optional. The pull request or issue where it was made, e.g. "#6".
#
# Example
#   [[decision]]
#   name = "Example CAN Tool"
#   url = "https://github.com/example/can-tool"
#   decision = "removed"
#   reason = "Archived in 2024 with no successor, and superseded by tools already listed."
#   date = "2026-09-20"
#   ref = "#42"
#
# Keep records in date order, oldest first. Deliberately not recorded:
# Illusion and Dazzle, dropped in #8 but restored in #10, since a restored
# candidate carries no decision; and the URL moves for URH, Atlas and the
# Automotive Security Timeline in #5, which were fixes rather than decisions.

[[decision]]
name = "Entropy-based Anomaly Detection for In-Vehicle Networks"
url = "https://www.semanticscholar.org/paper/Entropy-based-anomaly-detection-for-in-vehicle-M%C3%BCter-Asaj/7e0e23218cfad13c0efb6a506bbc44a6ddbace3a"
decision = "rejected"
reason = "Muter and Asaj, IV 2011. One of the two weakest papers proposed for Research Papers, and its only copy was on Semantic Scholar, which answers the checker with a 202 challenge; dropped rather than given a link-check exclusion."
date = "2026-09-14"
ref = "#6"

[[decision]]
name = "Intrusion Detection System Based on the Analysis of Time Intervals of CAN Messages"
url = "https://pure.korea.ac.kr/en/publications/intrusion-detection-system-based-on-the-analysis-of-time-interval/"
decision = "rejected"
reason = "Song, Kim, and Kim, ICOIN 2016. One of the two weakest papers proposed for Research Papers, and its only copy was on Korea University's Pure instance, which answers the checker with 503; dropped rather than given a link-check exclusion."
date = "2026-09-14"
ref = "#6"

[[decision]]
name = "Universal Radio Hacker (URH)"
url = "https://github.com/jopohl/urh"
decision = "kept"
reason = "Archived, but still the canonical open-source tool for investigating unknown wireless protocols; CONTRIBUTING.md criterion 5 cites it as the example of an archived project that stays."
date = "2026-09-23"
ref = "#21"

[[decision]]
name = "mib2q-carplay-rgi"
url = "https://github.com/luka-dev/mib2q-carplay-rgi"
decision = "rejected"
reason = "Extensive reverse engineering of Audi MHI2Q firmware and the CarPlay iAP2 protocol, but the deliverable is a consumer feature patch (cluster route guidance for CarPlay), not an analysis, testing, or defense tool. Out of scope under CONTRIBUTING.md criterion 2's tuning-project carve-out despite the RE depth."
date = "2026-09-27"
ref = "#25"

[[decision]]
name = "flipper-tesla-fsd"
url = "https://github.com/hypery11/flipper-tesla-fsd"
decision = "rejected"
reason = "Popular (1.1k stars) Flipper Zero/ESP32 Tesla mod, but it is a feature-unlock and tuning tool (FSD region unlock, nag killer, track mode) rather than security tooling. Out of scope under CONTRIBUTING.md criterion 2; likely to resurface in future GitHub topic searches given its star count."
date = "2026-09-27"
ref = "#25"

[[decision]]
name = "QuickTARA"
url = "https://github.com/leonkalema/quicktara"
decision = "removed"
reason = "The GitHub repository was deleted or made private (404 under both spellings, gone from the author's repository list), and QuickTARA now lives only at quicktara.com, where it is no longer open source. Removed at the maintainer's request instead of being relinked there."
date = "2026-09-29"
ref = "#27"

[[decision]]
name = "can-bus-lab-lite"
url = "https://github.com/numbpill3d/can-bus-lab-lite"
decision = "rejected"
reason = "A four-commit starter (a candump parser and MCP2515 wiring notes) with no adoption, built as a free lead-in to the author's paid Gumroad courses. Listed tools such as python-can, cantools, SavvyCAN and CANarchy already cover it. Worth a new suggestion only if the author's work becomes established in the field."
date = "2026-09-29"
ref = "#26"

[[decision]]
name = "Zelos"
url = "https://zeloscloud.io"
decision = "rejected"
reason = "A commercial data platform for hardware systems in general; its own demo is a grid battery-storage system and CAN is one extension among many. It is neither automotive-specific nor security tooling (CONTRIBUTING.md criteria 1 and 2), and python-can, cantools, SavvyCAN and CANarchy already cover CAN analysis. Worth a new suggestion only if the company ships an automotive security tool or open-source CAN intrusion-analysis work."
date = "2026-10-10"
ref = "#38"
