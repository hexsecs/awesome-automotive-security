# Leads: candidates that were found but could not be opened or confirmed, so they
# are not yet proposed. Discovery runs read this file first and re-try each lead;
# when a lead is confirmed it is added to README.md (or rejected in
# data/decisions.toml) and its record is deleted in the same change.
#
# This is the "note unreachable candidates as leads" rule from CLAUDE.md made
# durable: a PR body is forgotten by the next run, this file is not.
#
# scripts/validate_list.py fails if a lead's URL is already in README.md, has a
# rejected or removed decision, is on an avoid host, or names a section the README
# does not have. A lead is not a verdict: it records what is unverified.
#
# Fields
#   name     What the lead is.
#   url      The URL to open and confirm.
#   section  The README section it would go in (or change).
#   reason   What is known, and exactly what could not be verified.
#   date     YYYY-MM-DD, when it was recorded.
#   ref      Optional. The pull request or issue it came up in, e.g. "#36".
#
# Keep records in date order, oldest first.

[[lead]]
